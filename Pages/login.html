<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal Login</title>
    <link rel="stylesheet" href="/Styles/pantrypal-styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-body">

    <div class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 auth-width">
                
                <h1 class="auth-title text-center">PantryPal</h1>

                <div class="card auth-card p-4">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-2">Login to Your Account</h4>
                        <p class="text-center text-muted mb-4">Sign in to access your pantry, recipes, and shopping lists.</p>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="emailInput" aria-describedby="emailHelp" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordInput" class="form-label">Password</label>
                                <input type="password" class="form-control" id="passwordInput" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-auth-primary w-100 mb-3">Sign In</button>
                            <div class="text-center">
                                <a href="forgotpassword.html" class="auth-link">Forgot Password?</a>
                            </div>
                        </form>
                    </div>
                </div>

                <p class="auth-text text-center mt-3">
                    Don't have an account? <a href="createaccount.html" class="auth-link">Sign Up</a>
                </p>

            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="/Scripts/notifications.js"></script>
    
    <script src="/Scripts/pantrypal-scripts.js"></script>
</body>
</html>
