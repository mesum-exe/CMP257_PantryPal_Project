<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PantryPal | Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Styles/pantrypal-styles.css">

  <style>
    .profile-card {
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: fadeInUp 0.8s ease;
    }
    .profile-title {
      color: var(--primary-green);
      font-weight: 800;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .profile-sub {
      color: var(--text-dark);
      opacity:0.7;
      text-align:center;
      margin-bottom:2rem;
      font-size:0.95rem;
    }
  </style>
</head>

<body class="auth-body">

  <div class="container auth-container d-flex flex-column align-items-center">
      
    <h1 class="profile-title">PantryPal</h1>

    <div class="profile-card w-100">

      <h3 class="text-center fw-bold mb-1" style="color:var(--text-dark);">Your Profile</h3>
      <p class="profile-sub">Manage your account details & household members</p>

      <div class="text-center mb-4">
        <img id="profilePic"
            src="/assets/default-user.png"
            style="width:130px; height:130px; border-radius: 50%; border:3px solid var(--primary-green); object-fit:cover;"
            alt="Profile Picture">
        <input type="file" id="picInput" accept="image/*" style="display:none;">
        <br>
        <button type="button" class="btn btn-auth-primary mt-3" id="changePicBtn" style="padding:8px 18px;">
          Upload Photo
        </button>
      </div>

      <form id="profileForm">

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="usernameInput" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="emailInput" class="form-control" placeholder="Enter your email">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" id="passwordInput" class="form-control" placeholder="Enter a password">
            <button type="button" class="btn btn-outline-secondary" id="togglePassword">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-auth-primary w-100 mt-2">
          Save Changes
        </button>
      </form>

      <hr class="my-4">

      <h5 class="fw-bold mb-2" style="color:var(--text-dark);">Household Members</h5>

      <ul class="list-group mt-3" id="householdList"></ul>

      <div class="input-group mt-3">
        <input type="text" id="newMemberInput" class="form-control" placeholder="Add household member name">
        <button class="btn btn-auth-primary" id="addMemberBtn">Add</button>
      </div>

    </div>
  </div>
  <script type="module" src="/Scripts/notifications.js"></script>

  <script src="profile.js"></script>
</body>
</html>
