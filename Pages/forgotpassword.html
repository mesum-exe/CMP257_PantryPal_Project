<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal Forgot Password</title>
    <link rel="stylesheet" href="/Styles/pantrypal-styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="auth-body">

    <div class="container auth-container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-8 col-lg-6 auth-width">
                
                <h1 class="auth-title text-center">Password Reset</h1>

                <div class="card auth-card p-4">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-2">Reset Your Password</h4>
                        
                        <p class="card-text text-muted text-center mb-4">
                            A link will be sent to reset your password.
                        </p>
                        
                        <form id="forgotPasswordForm">
                            <div class="mb-4">
                                <label for="emailInput" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="emailInput" required>
                            </div>
                            
                            <button type="submit" class="btn btn-auth-primary w-100 mb-3">Send Reset Link</button>
                        </form>
                        
                        <hr>
                        
                        <div class="text-center">
                            <a href="login.html" class="auth-link">&larr; Back to Login</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="/Scripts/notifications.js"></script>
    <script src="/Scripts/pantrypal-scripts.js"></script>
</body>
</html>
